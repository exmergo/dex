# expect: reference
# An expression reading a member the table does not declare.
# static: unchecked. Whether `total_price` is a column of ORDERS needs the
# warehouse, so dex's static reader accepts it; maintain's schema axis holds
# columns to the warehouse (#1293). Reading warns `unresolved_member`, and authoring
# refuses it in a file dex writes (#1292).
# warns: unresolved_member
name: unknown_member
tables:
  - name: orders
    base_table: {database: SNOWFLAKE_SAMPLE_DATA, schema: TPCH_SF1, table: ORDERS}
    primary_key: {columns: [o_orderkey]}
    metrics:
      - {name: revenue, expr: SUM(orders.total_price)}
