# expect: derived_metric
# A derived metric named like a table metric.
name: derived_name_clash
tables:
  - name: orders
    base_table: {database: SNOWFLAKE_SAMPLE_DATA, schema: TPCH_SF1, table: ORDERS}
    primary_key: {columns: [o_orderkey]}
    metrics:
      - name: order_count
        expr: COUNT(o_orderkey)
metrics:
  - {name: order_count, expr: orders.order_count * 2}
