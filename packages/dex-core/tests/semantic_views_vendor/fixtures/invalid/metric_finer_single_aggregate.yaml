# expect: granularity
# A metric reading a finer table's fact with one aggregate, where a nested one is needed.
name: metric_finer_single_aggregate
tables:
  - name: customer
    base_table: {database: SNOWFLAKE_SAMPLE_DATA, schema: TPCH_SF1, table: CUSTOMER}
    primary_key: {columns: [c_custkey]}
    dimensions:
      - {name: segment, expr: c_mktsegment}
    metrics:
      - {name: customer_revenue, expr: SUM(orders.total_price)}
  - name: orders
    base_table: {database: SNOWFLAKE_SAMPLE_DATA, schema: TPCH_SF1, table: ORDERS}
    primary_key: {columns: [o_orderkey]}
    facts:
      - {name: total_price, expr: o_totalprice}
    metrics:
      - name: order_count
        expr: COUNT(o_orderkey)
relationships:
  - name: orders_customer
    left_table: orders
    right_table: customer
    relationship_columns: [{left_column: o_custkey, right_column: c_custkey}]
