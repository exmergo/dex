# An ASOF relationship and a range relationship.
name: asof_range
tables:
  - name: lineitem
    base_table: {database: SNOWFLAKE_SAMPLE_DATA, schema: TPCH_SF1, table: LINEITEM}
    primary_key: {columns: [l_orderkey, l_linenumber]}
    time_dimensions:
      - name: ship_date
        expr: l_shipdate
        data_type: DATE
    facts:
      - name: extended_price
        expr: l_extendedprice
    metrics:
      - name: line_count
        expr: COUNT(l_linenumber)
  - name: customer_orders
    description: Each customer's orders, for an as-of lookup by date.
    base_table: {database: SNOWFLAKE_SAMPLE_DATA, schema: TPCH_SF1, table: ORDERS}
    primary_key: {columns: [o_orderkey]}
    unique_keys:
      - columns: [o_custkey, o_orderdate]
    dimensions:
      - name: order_priority
        expr: o_orderpriority
  - name: price_bands
    base_table: {database: DEX_SV, schema: FIXTURES, table: PRICE_BANDS}
    primary_key: {columns: [band_id]}
    # Undocumented in the YAML specification; this is how Snowflake reads back
    # `CONSTRAINT ... DISTINCT RANGE BETWEEN band_start AND band_end EXCLUSIVE`.
    constraints:
      - name: band_range
        distinct_range: {start_column: band_start, end_column: band_end}
    dimensions:
      - name: band_name
        expr: band_name
  - name: orders
    base_table: {database: SNOWFLAKE_SAMPLE_DATA, schema: TPCH_SF1, table: ORDERS}
    primary_key: {columns: [o_orderkey]}
    dimensions:
      - name: customer_key
        expr: o_custkey
relationships:
  - name: lines_to_orders
    left_table: lineitem
    right_table: orders
    relationship_columns: [{left_column: l_orderkey, right_column: o_orderkey}]
  - name: latest_customer_order
    left_table: orders
    right_table: customer_orders
    relationship_columns:
      - {left_column: o_custkey, right_column: o_custkey}
      - {left_column: o_orderdate, right_column: o_orderdate, type: asof}
  - name: price_band
    left_table: lineitem
    right_table: price_bands
    relationship_columns:
      - left_column: l_extendedprice
        type: range
        right_range: {start_column: band_start, end_column: band_end}
