name: DERIVED_METRICS
tables:
  - name: CUSTOMER
    base_table:
      database: SNOWFLAKE_SAMPLE_DATA
      schema: TPCH_SF1
      table: CUSTOMER
    primary_key:
      columns:
        - C_CUSTKEY
    dimensions:
      - name: MARKET_SEGMENT
        expr: c_mktsegment
        data_type: VARCHAR(10)
        access_modifier: public_access
    metrics:
      - name: CUSTOMER_COUNT
        expr: COUNT(c_custkey)
        access_modifier: public_access
  - name: ORDERS
    base_table:
      database: SNOWFLAKE_SAMPLE_DATA
      schema: TPCH_SF1
      table: ORDERS
    primary_key:
      columns:
        - O_ORDERKEY
    dimensions:
      - name: ORDER_PRIORITY
        expr: o_orderpriority
        data_type: VARCHAR(15)
        access_modifier: public_access
    facts:
      - name: TOTAL_PRICE
        expr: o_totalprice
        data_type: "NUMBER(12,2)"
        access_modifier: public_access
    metrics:
      - name: ORDER_COUNT
        expr: COUNT(o_orderkey)
        access_modifier: public_access
      - name: REVENUE
        expr: SUM(orders.total_price)
        access_modifier: public_access
metrics:
  - name: AVERAGE_ORDER_VALUE
    synonyms:
      - AOV
    description: Revenue per order.
    expr: orders.revenue / orders.order_count
    access_modifier: public_access
  - name: ORDERS_PER_CUSTOMER
    synonyms: []
    description: ""
    expr: orders.order_count / customer.customer_count
    access_modifier: public_access
relationships:
  - name: ORDERS_CUSTOMER
    left_table: ORDERS
    right_table: CUSTOMER
    relationship_columns:
      - left_column: O_CUSTKEY
        right_column: C_CUSTKEY
