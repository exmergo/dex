name: CORTEX_METADATA
description: Order analytics for Cortex Analyst.
tables:
  - name: ORDERS
    base_table:
      database: SNOWFLAKE_SAMPLE_DATA
      schema: TPCH_SF1
      table: ORDERS
    primary_key:
      columns:
        - O_ORDERKEY
    dimensions:
      - name: CLERK
        expr: o_clerk
        data_type: VARCHAR(15)
        access_modifier: public_access
        sample_values:
          - Clerk#000000951
      - name: ORDER_STATUS
        expr: o_orderstatus
        data_type: VARCHAR(1)
        access_modifier: public_access
        is_enum: true
        sample_values:
          - F
          - O
          - P
    metrics:
      - name: ORDER_COUNT
        expr: COUNT(o_orderkey)
        access_modifier: public_access
    filters:
      - name: open_orders
        description: Orders still open.
        expr: o_orderstatus = 'O'
    time_dimensions:
      - name: ORDER_DATE
        expr: o_orderdate
        data_type: DATE
        access_modifier: public_access
        sample_values:
          - 1995-01-01
module_custom_instructions:
  sql_generation: Treat order status F as fulfilled.
verified_queries:
  - name: '"orders by status"'
    sql: "SELECT o_orderstatus, COUNT(*) FROM __orders GROUP BY 1"
    question: How many orders are there per status?
    verified_at: 1767225600
    verified_by: maintainer
    use_as_onboarding_question: false
