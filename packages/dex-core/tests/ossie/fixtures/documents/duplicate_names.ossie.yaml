# Two datasets and two fields sharing a name inside one model, and two metrics
# sharing one. Each is a name that resolves to two definitions.
version: "0.2.0.dev0"
semantic_model:
  - name: shop
    datasets:
      - name: orders
        source: demo.main.orders
        fields:
          - name: order_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: order_id
          - name: order_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: id
      - name: orders
        source: demo.main.orders_v2
        fields:
          - name: order_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: order_id
    metrics:
      - name: revenue
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(orders.total)
      - name: revenue
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(orders.net)
