[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "exmergo-dex-core"
dynamic = ["version"]
description = "Analytics engineering for Claude Code and any agent: data warehouse exploration, dbt transformation and semantic modeling, and schema-drift maintenance on dbt."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Exmergo, Inc.", email = "support@exmergo.com" }]
keywords = [
  "analytics-engineering",
  "dbt",
  "claude-code",
  "text-to-sql",
  "semantic-layer",
  "duckdb",
  "data-engineering",
  "agent",
]

# Base dependencies are the canonical model (pydantic) and config parsing (pyyaml):
# what every surface needs regardless of what it talks to. Connector clients and
# the dialect engine live behind the extras below, so the zero-credential DuckDB
# on-ramp never pulls the cloud client stack, and a deployment that queries a
# hosted semantic layer over HTTP pulls neither.
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
]

[project.scripts]
dex = "exmergo_dex_core.cli:main"

[project.optional-dependencies]
# The dialect engine behind the guards. Not a user-facing choice: every extra that
# reaches a warehouse self-references it, so installing a connector always brings
# it. It exists as its own extra so the floor and the ceiling are declared in one
# place; duplicating the pin across the connector extras is what once let the
# declared floor (>=25) drift years behind what the code needed (>=28.6), and the
# resulting AttributeError landed on users at import.
#
# The floor is 28.6 because the query firewall's unnest allowlist references
# sqlglot expression classes at module scope, and `exp.JSONKeys` (Snowflake,
# Databricks, and DuckDB key enumeration) first exists there. Raise it whenever a
# newly referenced class raises the real minimum.
#
# There is a ceiling for the same reason there is a floor: those references are
# version-sensitive, and sqlglot majors have already broken this code twice (the
# `Union` to `SetOperation` rename, which `_QUERY_ROOTS` still accommodates, and
# the `from` to `from_` arg-key rename, which `_resolve_sources` still handles).
# Without a ceiling a future major renames a class and every new install breaks on
# something we could not have known about. The `sqlglot-canary` CI job runs the
# guards against the newest release on every push, so raising this ceiling is a
# deliberate act taken on evidence rather than a surprise.
#
# Absent it, the guarded commands refuse with an actionable message naming the
# connector extra to install (see `guards/dialect.py`); they never silently fall
# back to a weaker check.
sql = ["sqlglot>=28.6,<31"]
# The DuckDB on-ramp and the full local ETM loop: the duckdb client and
# dbt-duckdb (which pulls dbt-core). All three skills install this one
# extra, and transform/maintain author and build a dbt project against a DuckDB
# dev target, so dbt-duckdb belongs here. (This makes the on-ramp heavier than a
# pure explore-only install would need; a separate lighter explore extra can be
# split out later if that tradeoff matters.)
duckdb = ["duckdb>=1", "dbt-duckdb>=1.9", "exmergo-dex-core[sql]"]
# 3.17 is the floor for workload-identity auth (the keyless CI path). Like
# [duckdb], the extra carries the dbt adapter so transform can build against a
# Snowflake dev target with one install.
snowflake = ["snowflake-connector-python>=3.17", "dbt-snowflake>=1.9", "exmergo-dex-core[sql]"]
# Like [duckdb], the extra carries the dbt adapter (which pulls dbt-core) so
# transform can build against a BigQuery dev target with one install.
bigquery = ["google-cloud-bigquery>=3", "dbt-bigquery>=1.9", "exmergo-dex-core[sql]"]
# Like [duckdb], the extra carries the dbt adapter (which pulls dbt-core) so
# transform can build against a Databricks dev target with one install. The SDK
# rides alongside the SQL driver: free Unity Catalog metadata and warehouse facts
# come from the REST API, so nothing billable is touched until a statement runs.
databricks = [
  "databricks-sql-connector>=3",
  "databricks-sdk>=0.30",
  "dbt-databricks>=1.9",
  "exmergo-dex-core[sql]",
]
# Like [duckdb], the extra carries the dbt adapter (which pulls dbt-core) so
# transform can build against a Postgres dev schema with one install.
postgres = ["psycopg[binary]>=3", "dbt-postgres>=1.9", "exmergo-dex-core[sql]"]
# Like [duckdb], the extra carries the dbt adapter (which pulls dbt-core) so
# transform can build against a Redshift dev schema with one install. boto3
# rides alongside the driver: Serverless workgroup facts (endpoint, base
# capacity) come from the control plane, and the driver mints IAM temporary
# database credentials through the same chain.
redshift = [
  "redshift-connector>=2.1",
  "boto3>=1.34",
  "dbt-redshift>=1.9",
  "exmergo-dex-core[sql]",
]
# Like [duckdb], the extra carries the dbt adapter (which pulls dbt-core) so
# transform can build against a ClickHouse dev database with one install.
# clickhouse-connect is the official driver and speaks the HTTP interface,
# which is also the one dbt-clickhouse defaults to.
clickhouse = [
  "clickhouse-connect>=0.8",
  "dbt-clickhouse>=1.8",
  "exmergo-dex-core[sql]",
]
# The local semantic-layer query backend (`explore semantic query --local`):
# MetricFlow renders metric SQL via explain(), and dex executes it through its own
# connector and cost guard. Just the metricflow library (not dbt-metricflow, whose
# CLI bundle pulls a dbt adapter the active connector extra already provides). 0.211
# is the floor that resolves against a released dbt-semantic-interfaces (0.209 pins
# a prerelease). `explore semantic list --local` is a pure manifest read-view and
# needs none of this.
semantic = ["metricflow>=0.211,<0.212", "exmergo-dex-core[sql]"]
# The hosted dbt Cloud Semantic Layer backend (`explore semantic --api`): a thin
# GraphQL client over httpx, nothing else. No warehouse client and no dbt-core:
# dbt Cloud owns the warehouse connection and executes server-side, so a
# pure-remote user (no local dbt project) installs only this.
semantic-api = ["httpx>=0.27"]
# k-means clustering (`explore cluster`). scikit-learn pulls numpy and scipy, so
# it is deliberately NOT a base dependency: the light default and the [duckdb]
# on-ramp stay lean, and this extra is installed only when clustering is actually
# used. The engine lazy-imports sklearn and returns an actionable envelope when
# the extra is absent; the explore skill wrapper adds this extra automatically
# when it sees an `explore cluster` invocation. Connector-agnostic (clustering
# runs on the feature sample in-process, whatever warehouse it came from).
cluster = ["scikit-learn>=1.4"]
# The storage conformance contract (`exmergo_dex_core.storage.conformance`), for
# anyone implementing a `Store` backend outside this distribution: it is the
# executable copy of the rules stated on the protocol, and it needs a test runner
# to execute them. Named for what it is conformance *to*, matching every other
# extra here: an install line has to answer "conformance to what?" on its own.
# Contributor tooling rather than a capability, which is why [all] omits it.
#
# It self-references [sql] for the same reason the connector extras do. The plan
# tier's assertions build a `TransformPlan`, which reaches the SQL guard and so the
# dialect engine, so an implementer of the full `Store` tier cannot run the suite
# without it. Shipping only pytest sent them ten failures that read as bugs in their
# own backend. The explore tier still runs without a dialect engine (`a_plan`
# imports lazily and a packaging test installs no extra at all), so this is a floor
# raised for the wider tiers rather than a new requirement on the narrow one.
storage-conformance = ["pytest>=8", "exmergo-dex-core[sql]"]
# The project conformance contract (`exmergo_dex_core.adapters.conformance`), for
# anyone implementing a project format outside this distribution. Named on the same
# rule as the extra above: an install line answers "conformance to what?" alone.
#
# Unlike [storage-conformance] this needs no dialect engine, and that is a property
# worth keeping rather than a coincidence: the contract reads a project and asserts
# on `ProjectDefinitions`, so nothing in it reaches the SQL guard. A packaging test
# holds it true, because the cheapest way for this to acquire a heavier floor is for
# an assertion to start building something that parses SQL.
project-conformance = ["pytest>=8"]
# The semantic-backend conformance contract
# (`exmergo_dex_core.explore.semantic.conformance`), for anyone implementing a
# semantic-layer backend outside this distribution. Named on the same rule as the
# two above: an install line answers "conformance to what?" alone.
#
# Pytest and nothing else, and that floor is the point rather than a coincidence.
# The contract reads a catalog and asserts on its shape, so it reaches neither the
# dialect engine nor a warehouse client, and it does not need either semantic
# extra: the reference layer is data in the module, so an implementer runs the
# suite against their own backend without installing MetricFlow or httpx to do it.
# A packaging test holds that true.
semantic-conformance = ["pytest>=8"]
# One command for users who want every optional capability at once: every
# connector, both semantic-layer backends, and clustering. Self-references the
# other extras so their requirement lists stay defined in exactly one place, which
# does mean this reference list is the part that rots, so a test asserts it covers
# every extra. Excludes dev and storage-conformance, both contributor tooling rather
# than a capability: nobody installing "everything dex can do" wants a test runner.
# This is the heaviest install there is (seven dbt adapters, MetricFlow, and
# scikit-learn); the light default and the [duckdb] on-ramp are unchanged.
all = [
  "exmergo-dex-core[bigquery,clickhouse,cluster,databricks,duckdb,postgres,redshift,semantic,semantic-api,snowflake,sql]",
]
# Contributor tooling, plus the optional libraries the suite exercises directly
# (the clustering tests need scikit-learn, the firewall tests need the dialect
# engine), so `uv sync --extra dev` runs the whole suite without also picking a
# connector.
dev = ["ruff==0.15.19", "scikit-learn>=1.4", "exmergo-dex-core[sql,storage-conformance]"]

[project.urls]
Homepage = "https://www.exmergo.com/dex"
Repository = "https://github.com/exmergo/dex"

[tool.hatch.build.targets.wheel]
packages = ["src/exmergo_dex_core"]

# The version is the git tag (v0.1.0 -> 0.1.0): one source of truth, never a
# hand-edited literal that can drift from the tag the release pipeline cuts.
# fallback_version keeps source builds that cannot reach .git (for example a
# build in an isolated temp dir) from failing; CI guards against an accidental
# fallback by asserting the built version equals the tag before publishing.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# This package lives in a subdirectory; the repository .git is two levels up.
root = "../.."
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode imports each test file as a unique module without sys.path
# manipulation, so the package-mirroring test tree can reuse basenames (e.g. a
# test_commands.py per capability) without import-file-mismatch collisions.
addopts = "--import-mode=importlib"
# importlib mode does not put the rootdir on sys.path, so the shared test
# doubles under tests/fakes/ need an explicit path entry to be importable.
pythonpath = ["tests"]
markers = [
  "integration: hits a live warehouse; gated on DEX_TEST_* environment variables",
  "live_open_adapter: opts a test out of the hermetic open_adapter raiser (composed flows on local duckdb)",
  "bigquery: BigQuery-specific integration tests",
  "snowflake: Snowflake-specific integration tests",
  "databricks: Databricks-specific integration tests",
  "postgres: PostgreSQL-specific integration tests",
  "redshift: Redshift-specific integration tests",
  "clickhouse: ClickHouse-specific integration tests",
  "clickhouse_cloud: narrow ClickHouse Cloud integration tests (protected credentials required)",
  "packaging: builds a wheel and runs against it in an isolated environment; slow, needs uv",
]
