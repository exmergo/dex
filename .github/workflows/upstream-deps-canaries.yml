name: Upstream canaries (sqlglot, DuckDB, next Python, Elementary)

# A weekly run of the suite against the newest sqlglot, above the ceiling the
# project declares. The query firewall matches sqlglot expression classes by name
# at module scope, so a sqlglot major that renames one breaks every install that
# resolves it. The declared dependency is therefore capped, and this run is how
# the cap stays honest: a breaking release surfaces here within a week instead of
# on a user's machine after we raise the ceiling blind.
#
# Weekly rather than per pull request: the question it answers is about an
# upstream release, which a week is soon enough to learn of, and re-running the
# whole suite on every pull request to ask it again would be waste. A red run is
# a signal to investigate upstream, never a merge blocker; `ci.yml`'s `tests` and
# `safety` jobs remain the real gates.
#
# Deliberately a mirror of `ci.yml`'s `tests` job rather than a narrower
# selection: the firewall is not the only dialect-dependent code (relationship
# probes and drift checks transpile per connector), and this run is only
# informative if a red run means "the new sqlglot broke something" rather than
# "the canary environment was missing something". Two safety-spine tests import
# boto3 and httpx unguarded and get them transitively from the [redshift] and
# [databricks] extras, so a narrower sync fails for reasons that have nothing to
# do with sqlglot. Packaging tests are excluded because they resolve sqlglot
# inside isolated installs from the declared cap, so they would report on the
# capped version and not the one under test.
#
# One leg per supported interpreter, none cancelling another, so a red run says
# which Python the new sqlglot broke on rather than only that it broke.
#
# The DuckDB jobs apply the same reasoning to DuckDB, whose 2.0 changed the
# Python client's relation API underneath an engine that declared `duckdb>=1`
# (#797). The [duckdb] extra supports 1.5 and 2.x and caps below 3:
# `duckdb-canary` runs the suite against the newest release, so a 3.0 is let in
# on evidence, and `duckdb-1x` holds the 1.5 floor to the same suite now that
# the lock (and so every per-pull-request job) is on 2.x.
#
# `python-next` asks the same question of the next Python, which dex does not
# support yet (3.15, #1134): the skill wrappers, `.python-version` and the
# classifiers stop at 3.14 because the stack ships no 3.15 wheels for several
# compiled dependencies, and building them from source fails. It installs the
# engine with every extra into a fresh 3.15 environment, resolved from the ranges
# pyproject.toml declares rather than from the lock (a newer release inside a
# range is often the one that ships the wheel), on Linux, macOS and Windows, and
# runs the suite on Linux. Green on every leg means the range can be widened: add
# the version to the wrappers, the classifiers and every matrix
# (test_python_support.py lists them), and refresh the lock. Before the install it prints which resolved packages still have no
# wheel for the version, which names the blocker whether or not a source build
# would rescue it.
#
# `elementary-release` watches the dbt package hub for a release of the
# Elementary package newer than the newest slot of the Elementary fixture's
# release matrix (#1446; the matrix and the rule for adding a release are in
# CONTRIBUTING.md). It reads the hub's public, keyless API, the URL `dbt deps`
# builds, and the engine's TESTED_RELEASES, with the runner's own Python and no
# install, so it needs no secret. Red means a new release is out and a person
# opens the pull request the rule describes; the job opens none itself, since a
# pull request the workflow's token opens runs no workflow and the fixture never
# runs on a pull request.

on:
  schedule:
    # Mondays at 07:10 UTC (off the hour to avoid GitHub's cron congestion).
    - cron: "10 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sqlglot-canary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          # The matrix interpreter for both the sync and the run: the canary
          # varies sqlglot, never ubuntu-latest's system Python.
          python-version: ${{ matrix.python-version }}
      - name: Sync (duckdb + bigquery + snowflake + databricks + postgres + redshift + clickhouse + trino + dev extras)
        run: uv sync --locked --extra duckdb --extra bigquery --extra snowflake --extra databricks --extra postgres --extra redshift --extra clickhouse --extra trino --extra dev --python ${{ matrix.python-version }}
      # A direct install into the synced environment, which is what lets it ignore
      # the ceiling the project declares. `uv sync` would resolve back to the cap.
      - name: Install the newest sqlglot over the declared ceiling
        run: uv pip install --upgrade sqlglot
      # --no-sync so the test run cannot quietly restore the capped version and
      # report a green canary that tested nothing, which would be worse than having
      # no canary at all. The version is echoed in the same step for that reason:
      # the log has to show which sqlglot actually ran.
      - name: Suite against the newest sqlglot
        run: |
          uv run --no-sync python -c "import sys, sqlglot; print('python', sys.version); print('testing sqlglot', sqlglot.__version__)"
          uv run --no-sync pytest -q -m "not packaging"

  duckdb-canary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync (duckdb + bigquery + snowflake + databricks + postgres + redshift + clickhouse + trino + dev extras)
        run: uv sync --locked --extra duckdb --extra bigquery --extra snowflake --extra databricks --extra postgres --extra redshift --extra clickhouse --extra trino --extra dev --python ${{ matrix.python-version }}
      # Over the declared ceiling, the same way and for the same reason as the
      # sqlglot install above. dbt-duckdb declares no ceiling of its own, so the
      # dbt-backed tests run against the new client too.
      - name: Install the newest DuckDB over the declared ceiling
        run: uv pip install --upgrade duckdb
      - name: Suite against the newest DuckDB
        run: |
          uv run --no-sync python -c "import sys, duckdb; print('python', sys.version); print('testing duckdb', duckdb.__version__)"
          uv run --no-sync pytest -q -m "not packaging"

  duckdb-1x:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync (duckdb + bigquery + snowflake + databricks + postgres + redshift + clickhouse + trino + dev extras)
        run: uv sync --locked --extra duckdb --extra bigquery --extra snowflake --extra databricks --extra postgres --extra redshift --extra clickhouse --extra trino --extra dev --python ${{ matrix.python-version }}
      # Down to the newest release of the 1.x line the [duckdb] extra still
      # admits, with --no-sync below for the same reason as above: a sync would
      # restore the locked 2.x.
      - name: Install the newest DuckDB 1.x
        run: uv pip install "duckdb>=1.5,<2"
      - name: Suite against DuckDB 1.x
        run: |
          uv run --no-sync python -c "import sys, duckdb; print('python', sys.version); print('testing duckdb', duckdb.__version__)"
          uv run --no-sync pytest -q -m "not packaging"

  # One leg per runner OS: a wheel missing on macOS or Windows blocks the users
  # there as surely as one missing on Linux, so the range is widened only when
  # every leg is green. Each leg installs every extra; the suite runs on Linux,
  # where the other canaries run it (os-canaries.yml covers the other systems on
  # the supported range).
  python-next:
    name: python-next (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The one Python above the supported range. Moves up when the range does.
      NEXT_PYTHON: "3.15"
    defaults:
      run:
        shell: bash
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: ${{ env.NEXT_PYTHON }}
      # Informational: the resolved packages with no wheel for the next Python on
      # Linux, macOS and Windows. A pure-Python package that publishes only an
      # sdist is listed too and installs fine, so this never fails the job, and a
      # platform whose resolution fails is reported and skipped rather than
      # ending the report; the install legs are the verdict. Once, on Linux,
      # since it reads the index rather than the runner.
      - name: Packages with no wheel for the next Python
        if: runner.os == 'Linux'
        run: |
          for platform in x86_64-manylinux_2_28 aarch64-apple-darwin x86_64-pc-windows-msvc; do
            if ! uv pip compile pyproject.toml --extra all --extra dev \
                --python-version "$NEXT_PYTHON" --python-platform "$platform" \
                --no-header --no-annotate -q -o "$RUNNER_TEMP/next-$platform.txt"; then
              echo "$platform: the extras do not resolve for $NEXT_PYTHON"
              continue
            fi
            missing=()
            while read -r requirement; do
              case "$requirement" in ""|"#"*) continue ;; esac
              if ! echo "$requirement" | uv pip compile - --no-deps --only-binary :all: \
                  --python-version "$NEXT_PYTHON" --python-platform "$platform" \
                  -q -o /dev/null 2>/dev/null; then
                missing+=("$requirement")
              fi
            done < "$RUNNER_TEMP/next-$platform.txt"
            echo "$platform: ${#missing[@]} without a wheel: ${missing[*]:-none}"
          done
      # A fresh resolution from the declared ranges, never --locked, and every
      # extra, so a green leg means a user's `pip install "exmergo-dex-core[all]"`
      # works on this Python and this system today.
      - name: Install every extra on the next Python
        run: |
          uv venv --python "$NEXT_PYTHON" "$RUNNER_TEMP/next-venv"
          uv pip install --python "$RUNNER_TEMP/next-venv" ".[all,dev]"
      - name: Import the stack
        run: |
          python="$RUNNER_TEMP/next-venv/bin/python"
          [ -x "$python" ] || python="$RUNNER_TEMP/next-venv/Scripts/python.exe"
          "$python" -c "import sys, dbt.version, duckdb, sqlglot, exmergo_dex_core; print(sys.version); print('dbt-core', dbt.version.__version__, 'duckdb', duckdb.__version__, 'sqlglot', sqlglot.__version__)"
      - name: Suite on the next Python
        if: runner.os == 'Linux'
        run: '"$RUNNER_TEMP/next-venv/bin/python" -m pytest -q -m "not packaging"'

  elementary-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The newest Elementary release on the dbt package hub is in the matrix
        run: python3 scripts/check_elementary_release.py
