name: OS canaries (Windows, macOS)

# A weekly run of the tier-1 unit tests on Windows (#487, part 4). Windows is
# not a claimed platform, so this is not a required check and does not run per
# pull request: the suite takes a quarter of an hour on a Windows workstation,
# and a Windows leg on every pull request would be the slowest job in CI and
# would add Windows-only flakiness (file locking on temp directories, DuckDB
# file handles, subprocess differences) as a merge blocker. A weekly run still
# catches the class of regression #264 and #487 were (a platform separator in
# a path the engine prints, a test that assumes POSIX) within days, instead of
# waiting for the next Windows user to report it.
#
# The sync is the one `ci.yml`'s `tests` job uses, every connector extra
# included, so a test that would `importorskip` for want of a client library
# runs here the same as it does there. One Python version rather than that
# job's matrix: this run exists to catch platform defects, which do not vary
# by interpreter, and four Windows runs a week would quadruple the cost of
# finding each one once. That version is the newest supported, 3.14, because
# compiled dependencies are where a platform and a new interpreter meet: a
# missing Windows wheel for 3.14 is a defect only this run can see (#795).
#
# The macos job is the same run on macOS, for the same reason: CI's Linux jobs
# say nothing about the macOS wheels a contributor's or user's install resolves.

on:
  schedule:
    # Mondays at 06:40 UTC (off the hour to avoid GitHub's cron congestion).
    - cron: "40 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    # The full suite took just under eighteen minutes on a Windows workstation
    # with every extra installed; a hosted runner is slower. A bound well above
    # that, so a hung test fails the run rather than holding a runner for the
    # six-hour default.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      # Git for Windows defaults to core.autocrlf=true, and actions/checkout
      # does not override it, so a plain checkout rewrites every text file
      # with CRLF. Three tests hash the bundled Ossie schema's bytes and the
      # loader records that hash as provenance, so a CRLF checkout reads as
      # "the bundled schema moved" (its sha256 becomes 70aec8d9... instead of
      # the recorded 2cf11e3c...). The wheel ships LF, so the job checks out
      # what the wheel ships. Before checkout, because that is when the
      # conversion happens.
      - name: Check out with the bytes the repository holds
        run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync (duckdb + bigquery + snowflake + databricks + postgres + redshift + clickhouse + trino + dev extras)
        run: uv sync --locked --extra duckdb --extra bigquery --extra snowflake --extra databricks --extra postgres --extra redshift --extra clickhouse --extra trino --extra dev --python 3.14
      - name: Tier-1 unit tests
        run: uv run --no-sync pytest -q

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # A version request alone can select the runner's Homebrew Python. Its
      # OpenSSL 4 build has no ssl.PROTOCOL_TLSv1, which Snowflake 4.8.0's
      # vendored urllib3 still references at import. Use uv's managed build
      # throughout setup, sync, tests and their isolated packaging subprocesses.
      # Track the upstream fix as SNOW-4232077; see CONTRIBUTING.md.
      UV_MANAGED_PYTHON: "true"
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync (every optional capability + dev extras)
        run: uv sync --locked --extra all --extra dev --python 3.14
      - name: Interpreter and TLS stack under test
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.metadata
          import ssl
          import sys

          print("Python:", sys.version, flush=True)
          print("Executable:", sys.executable, flush=True)
          print("Base executable:", sys._base_executable, flush=True)
          print("OpenSSL:", ssl.OPENSSL_VERSION, flush=True)
          print("PROTOCOL_TLSv1 present:", hasattr(ssl, "PROTOCOL_TLSv1"), flush=True)
          print("snowflake-connector-python:", importlib.metadata.version("snowflake-connector-python"), flush=True)
          import snowflake.connector

          print("Snowflake connector import: OK", flush=True)
          PY
      - name: Tier-1 unit tests
        run: uv run --no-sync pytest -q
