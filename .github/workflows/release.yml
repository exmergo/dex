name: Release

# A semver tag drives the whole chain: a coupling check, build, then PyPI
# publish via Trusted Publishing (OIDC, no stored tokens) and the anti-squat
# name stubs, then the documentation site. The wrapper pins and the changelog
# are written before tagging (scripts/prepare_release.sh), so this workflow never
# writes back to this repository; it verifies the tagged commit is
# self-consistent before it publishes. Its one write outside PyPI is the Dex
# section of the documentation site, committed to exmergo/docs after publish.
#
# There is no test gate here. A tag points at a commit on main, every commit on
# main arrived through a pull request, and ci.yml's `tests` and `safety` jobs
# gate that pull request; re-running the same suite on the same commit at tag
# time would pay twice for an answer that cannot differ.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # Read-only guard, run before publishing: the wrapper pins are bumped before
  # the tag (scripts/prepare_release.sh), so the tagged commit must already pin
  # the version this tag will publish and carry its CHANGELOG.md section, which
  # the same script writes. If it does not, the tag was cut without
  # running the prepare script, and shipping it would couple the plugin to the
  # wrong engine version (especially once the public catalog pins this tag), so
  # we fail before anything reaches PyPI. No writes, so branch protection is moot.
  verify-coupling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wrapper pins and the changelog must match the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          fail=0
          for skill in explore transform maintain; do
            f="skills/${skill}/scripts/run.py"
            if ! grep -qF "DEX_CORE_VERSION = \"${VERSION}\"" "$f"; then
              echo "${f} is not pinned to ${VERSION}:"
              grep -n "DEX_CORE_VERSION" "$f" || true
              fail=1
            fi
          done
          if ! grep -qxF "fallback_version = \"${VERSION}\"" packages/dex-core/pyproject.toml; then
            echo "packages/dex-core/pyproject.toml fallback_version is not ${VERSION}:"
            grep -n "fallback_version" packages/dex-core/pyproject.toml || true
            fail=1
          fi
          if ! grep -qF "## [${VERSION}] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no ${VERSION} section."
            fail=1
          fi
          if [ "$fail" = "1" ]; then
            echo "Run scripts/prepare_release.sh ${VERSION}, commit, and re-tag."
            exit 1
          fi
          echo "All wrapper pins match ${VERSION}, and CHANGELOG.md has its section."

  publish:
    needs: [verify-coupling]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Job-level permissions REPLACE the top-level block, they do not merge, so
      # contents:read must be repeated here or checkout 404s with the token
      # holding only id-token:write.
      contents: read
      id-token: write  # OIDC for PyPI Trusted Publishing; no API tokens stored.
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from the tag; it needs full history
          # and the tags, which the default shallow checkout omits.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Build sdist + wheel
        run: uv build
      - name: Assert built version matches the tag
        # Hard stop against the version-drift class of bug: if hatch-vcs fell
        # back (or the tag was unreadable), the wheel would not carry the tag
        # version and we must not publish it.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! ls dist/exmergo_dex_core-"${VERSION}"-*.whl >/dev/null 2>&1; then
            echo "Built artifacts do not match tag version ${VERSION}:"
            ls -1 dist/
            exit 1
          fi
      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish
      # Optionally emit PEP 740 / Sigstore attestations for provenance.

  # The documentation site, published from the tag only after PyPI accepted the
  # release, so the docs always describe what `pip install` gives you. Build,
  # validation and the commit to exmergo/docs live in docs-site.yml.
  #
  # Started as a run of its own (workflow_dispatch) rather than called as a
  # reusable workflow: its deploy job reads the docs publisher app's key from
  # the docs-site environment, and a reusable-workflow call does not receive
  # that environment's secrets (the v1.14.1 release published nothing for that
  # reason, while the same job dispatched by hand did). A dispatch made with
  # GITHUB_TOKEN is one of the events GitHub does start a run for. Pre-releases
  # and backports are not dispatched: they never replace the newest docs.
  docs-site:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write  # to start the Docs site workflow, and nothing else
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # every tag, to tell the newest final release
      - name: Start the Docs site workflow for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::${TAG} is a pre-release; the docs are not published."
            exit 0
          fi
          if [ "$TAG" != "$newest" ]; then
            echo "::notice::${TAG} is not the newest release (${newest}); a backport never replaces newer docs."
            exit 0
          fi
          gh workflow run docs-site.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f ref="$TAG"
          echo "Started Docs site for ${TAG}; follow it under Actions > Docs site."

  # Anti-squat: claim and hold names people would guess for the engine, each a
  # placeholder that redirects users to exmergo-dex-core. This is a one-time
  # reservation per name, so it must be idempotent across releases.
  # `uv publish --check-url` does NOT achieve that: it skips a file only when the
  # remote copy is byte-identical, and a rebuilt static-version (0.0.0) stub wheel
  # is not reproducible, so its hash differs from the copy published on the first
  # release and uv errors ("Local file and index file do not match") instead of
  # skipping.
  # So we gate on whether the project already exists on PyPI and no-op if it does.
  #
  # Each name needs its own PyPI Trusted Publisher with its own environment, never
  # one shared with another job. PyPI rejects two pending publishers with an
  # identical owner/repo/workflow/environment, and when minting a token it matches
  # a pending publisher before a live one, so a pending publisher on a shared
  # environment would be claimed by whichever job mints first. One environment per
  # project also keeps each minted token scoped to that one project. Adding a name
  # means a stub package under packages/, a matrix entry, and a pending publisher
  # on PyPI for that project and environment.
  reserve-names:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: dex-core
            path: packages/dex-core-stub
            environment: pypi-stub
          - project: exmergo-dex
            path: packages/exmergo-dex-stub
            environment: pypi-stub-exmergo-dex
    name: reserve ${{ matrix.project }}
    environment: ${{ matrix.environment }}
    permissions:
      contents: read  # see the publish job: job-level permissions replace, not merge.
      id-token: write
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Reserve the name on PyPI (once; no-op if it already exists)
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          # Publish only on a definite 404 (name not yet reserved). On 200 the
          # name is already held, so skip. On any other response (network/5xx)
          # skip too, rather than risk the non-idempotent publish path above.
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/${PROJECT}/json")
          case "$code" in
            200) echo "${PROJECT} is already reserved on PyPI; nothing to do."; exit 0 ;;
            404) echo "${PROJECT} not found on PyPI; building and publishing the stub." ;;
            *)   echo "Unexpected HTTP ${code} from PyPI; skipping to avoid a bad publish."; exit 0 ;;
          esac
          uv build
          uv publish
