name: Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Ruff lints and format-checks every Python tree in the repo from the root,
  # governed by ruff.toml. This gate must pass before a PR can merge into main.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx ruff@0.17.2 check --output-format=github .
      - name: Ruff format check
        run: uvx ruff@0.17.2 format --check --diff .

  mypy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Type check maintain and storage
        run: uvx --with pydantic --with types-PyYAML mypy
