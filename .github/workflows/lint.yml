name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Ruff lints and format-checks every Python tree in the repo from the root,
  # governed by ruff.toml. This gate must pass before a PR can merge into main.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx ruff@0.15.19 check --output-format=github .
      - name: Ruff format check
        run: uvx ruff@0.15.19 format --check --diff .
