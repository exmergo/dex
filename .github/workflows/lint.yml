name: Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Ruff lints and format-checks every Python tree in the repo from the root,
  # governed by ruff.toml. This gate must pass before a PR can merge into main.
  # The version is the one packages/dex-core/uv.lock pins, read by
  # scripts/uvx_locked.py, never restated here: Dependabot bumps the [dev] pin
  # and the lock together and cannot see a copy in this file (#1137).
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Ruff lint
        run: python3 scripts/uvx_locked.py ruff check --output-format=github .
      - name: Ruff format check
        run: python3 scripts/uvx_locked.py ruff format --check --diff .

  mypy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Type check maintain and storage
        run: uvx --with pydantic --with types-PyYAML mypy
