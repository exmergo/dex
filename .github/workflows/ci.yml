name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Tier 1: engine correctness + the safety-critical assertions. Deterministic,
  # fast, free (DuckDB is the test engine). The always-on release gate.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The cloud extras are included so their unit tests and safety families
      # run here (they are offline against fake clients, but they importorskip
      # on the client libraries; without the extras they would silently skip).
      - name: Sync (duckdb + bigquery + snowflake + databricks + postgres + redshift + clickhouse + dev extras)
        run: uv sync --extra duckdb --extra bigquery --extra snowflake --extra databricks --extra postgres --extra redshift --extra clickhouse --extra dev --python ${{ matrix.python-version }}
      - name: Tier-1 unit tests
        run: uv run pytest -q

  # The safety spine is broken out as its own gate so a regression on a
  # safety-critical assertion is unmistakable in the checks list. Strict: an
  # unexpected pass (a placeholder going green early) is fine; a real
  # failure blocks the merge regardless of any benchmark score.
  safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (duckdb + bigquery + snowflake + databricks + postgres + redshift + clickhouse + dev extras)
        run: uv sync --extra duckdb --extra bigquery --extra snowflake --extra databricks --extra postgres --extra redshift --extra clickhouse --extra dev
      - name: Safety-critical assertions
        run: uv run pytest -q tests/test_safety_spine.py

  # The query firewall matches sqlglot expression classes by name at module scope,
  # so a sqlglot major that renames one breaks every install that resolves it. The
  # declared dependency is therefore capped, and this job is how the cap stays
  # honest: it installs the newest sqlglot over the cap and re-runs the suite
  # against it, so a breaking release surfaces here on the next push instead of on
  # a user's machine after we raise the ceiling blind.
  #
  # Deliberately a mirror of the `tests` job rather than a narrower selection: the
  # firewall is not the only dialect-dependent code (relationship probes and drift
  # checks transpile per connector), and this job is only informative if a red run
  # means "the new sqlglot broke something" rather than "the canary environment was
  # missing something". Two safety-spine tests import boto3 and httpx unguarded and
  # get them transitively from the [redshift] and [databricks] extras, so a narrower
  # sync fails for reasons that have nothing to do with sqlglot. Packaging tests are
  # excluded because they resolve sqlglot inside isolated installs from the declared
  # cap, so they would report on the capped version and not the one under test.
  #
  # Advisory by design (continue-on-error): it reports on code we do not control,
  # so a red canary is a signal to investigate upstream, never a reason to block a
  # merge of unrelated work. The `tests` and `safety` jobs remain the real gates.
  sqlglot-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (duckdb + bigquery + snowflake + databricks + postgres + redshift + clickhouse + dev extras)
        run: uv sync --extra duckdb --extra bigquery --extra snowflake --extra databricks --extra postgres --extra redshift --extra clickhouse --extra dev
      # A direct install into the synced environment, which is what lets it ignore
      # the ceiling the project declares. `uv sync` would resolve back to the cap.
      - name: Install the newest sqlglot over the declared ceiling
        run: uv pip install --upgrade sqlglot
      # --no-sync so the test run cannot quietly restore the capped version and
      # report a green canary that tested nothing, which would be worse than having
      # no canary at all. The version is echoed in the same step for that reason:
      # the log has to show which sqlglot actually ran.
      - name: Suite against the newest sqlglot
        run: |
          uv run --no-sync python -c "import sqlglot; print('testing sqlglot', sqlglot.__version__)"
          uv run --no-sync pytest -q -m "not packaging"

  # `explore diagram` emits Mermaid and dex never renders it, so nothing in
  # pyproject.toml pins the syntax dialect it has to stay compatible with: the
  # contract is with a parser living in whatever tool a reader opens the diagram
  # in. This runs the renderer's own output through the real mermaid package,
  # which is the only way to hold that contract from here, and it is why there is
  # no Python mermaid dependency (every candidate is either a string builder that
  # replaces nothing, or a renderer that would POST the schema to a third-party
  # host). Advisory like sqlglot-canary and for the same reason: it tracks a
  # moving upstream, so a Mermaid release breaking our dialect should be loud
  # without blocking a merge that changed nothing.
  mermaid-syntax:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Installed outside the repo, and the checker is copied in beside it,
      # because Node resolves `node_modules` by walking up from the script's own
      # location. That keeps a 160MB dependency tree out of the working copy of a
      # Python repo, where nobody expects one and nothing ignores it. Pinned
      # major, floating within it, mirroring how sqlglot is bounded: a patch
      # should not be able to fail this, and moving the major should be a
      # deliberate act taken on this job's evidence.
      - name: Install the Mermaid parser outside the repo
        run: |
          mkdir -p "$RUNNER_TEMP/mermaid-canary"
          cd "$RUNNER_TEMP/mermaid-canary"
          npm install --silent mermaid@^11 jsdom@^26
          cp "$GITHUB_WORKSPACE/scripts/check_mermaid_syntax.mjs" .
      # Generated from the renderer rather than committed, so the corpus cannot
      # drift from what dex actually emits. The dump self-checks that it still
      # covers every cardinality glyph the policy can produce.
      - name: Render the fixture corpus
        run: uv run --project packages/dex-core python scripts/dump_mermaid_fixtures.py "$RUNNER_TEMP/mermaid-fixtures"
      - name: Parse every fixture with the real Mermaid parser
        run: |
          cd "$RUNNER_TEMP/mermaid-canary"
          node -e "console.log('testing mermaid', require('mermaid/package.json').version)"
          node check_mermaid_syntax.mjs "$RUNNER_TEMP/mermaid-fixtures"

  # The Tier-2 eval harness scoring core (triggering, output-quality, uplift math),
  # exercised with fake backends: deterministic, free, no model in the loop. The
  # live Claude-driven evals run on release, not here. Stdlib only, so uvx supplies
  # pytest and the harness needs no install.
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Eval scoring-core tests
        run: uvx pytest evals -q

  # On brand for Exmergo (easter egg): all shipped prose is em-dash free.
  em-dashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Repo prose must be em-dash clean
        run: |
          git ls-files '*.md' '*.mdc' '*.txt' \
            | xargs python scripts/check_no_em_dashes.py
