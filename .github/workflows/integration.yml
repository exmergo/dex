name: Integration

# Live cloud connectors use workload identity federation wherever the provider
# offers it. ClickHouse Cloud has no suitable GitHub OIDC path, so its narrow
# job is the documented exception: a service-scoped read-only API key and two
# database credentials live only in a main-protected environment and rotate
# through scripts/setup_clickhouse_cloud_ci.sh.
# Every stored credential reaches only what reads it, never a whole job: a key
# is written to an owner-only file by one step and read by the one command that
# needs it (scripts/clickhouse_cloud/secrets.sh for the Cloud API key), and a
# password rides on the env of the single step whose tests use it. Anything
# else a job runs (uv, pytest's plugins, dbt, the engine) never inherits them.
# Deliberately NOT a merge or release gate: ci.yml stays deterministic and
# fork-runnable; this workflow answers "does the connector still work against
# the real service" on main and on a schedule. Each suite reads shared/public
# sample data, writes only to its scratch scope, and caps every statement
# (bytes on BigQuery, seconds on Snowflake, Databricks, Redshift, and
# Postgres). ClickHouse additionally refuses at its 2 CHC UTC-day threshold.
#
# One-time setup (documented in CONTRIBUTING.md):
#   BigQuery: scripts/setup_bigquery_ci.sh (Workload Identity Pool provider
#   pinned to this repo + environment; service account with jobUser on the
#   project and dataEditor on the scratch dataset only).
#   Snowflake: scripts/setup_snowflake_ci.sh (a SERVICE user whose
#   WORKLOAD_IDENTITY accepts only GitHub OIDC tokens minted for this repo's
#   snowflake-integration environment; a least-privilege role on the pinned
#   X-Small warehouse and the transient scratch database; a resource monitor
#   as the hard monthly cost backstop).
#   Databricks: scripts/setup_databricks_ci.sh (a service principal whose
#   account-level federation policy accepts only GitHub OIDC tokens minted for
#   this repo's databricks-integration environment; CAN USE on a dedicated
#   2X-Small serverless warehouse with minimum auto-stop; read on samples,
#   write only in the scratch catalog. No resource-monitor analogue exists, so
#   the backstop is the smallest warehouse, auto-stop, per-statement
#   STATEMENT_TIMEOUT, and a workspace budget alert).
#   Redshift: scripts/setup_redshift_ci.sh (an IAM role whose trust policy
#   accepts only GitHub OIDC tokens minted for this repo's
#   redshift-integration environment, holding GetWorkgroup/GetNamespace/
#   GetCredentials on the smallest Serverless workgroup; a seeded app schema
#   read by dex_ro; a dbt_dev user writable only in its dev schema with a
#   durable statement_timeout; an RPU-hours-per-day usage limit as the hard
#   cost backstop).
#   Postgres: no setup at all. The operational-database connector runs against
#   a service container seeded from scripts/postgres_seed.sql (the same seed
#   scripts/setup_postgres_dev.sh applies locally): free, keyless, and
#   fork-runnable by construction, kept here for pattern parity with the other
#   connectors rather than as a cost decision.
#   Elementary: no setup. The fixture's two files run in a step of the postgres
#   job and in the elementary_duckdb job, installing the package from the dbt
#   package hub; neither needs an account.
#   ClickHouse: the exhaustive suite remains a free, keyless, fork-runnable
#   container started by scripts/setup_clickhouse_dev.sh. A separate narrow
#   ClickHouse Cloud job uses the protected clickhouse-cloud-integration
#   environment, refuses on the UTC-day CHC threshold before any SQL connection
#   wakes the service, and shares the same parameterized data fixture.
#   Cube: the `cube` job needs no setup: render-only Cube Core containers (dex
#   executes, #913) and executing ones (`--api`, #914) started by
#   scripts/setup_cube_dev.sh, over the Postgres service container and an
#   in-memory DuckDB. The render-only path also runs over ClickHouse and Trino
#   (#1410): the job starts its own keyless containers with the scripts the
#   `clickhouse` and `trino` jobs use. A separate narrow `cube_cloud` job asks a
#   Cube Cloud deployment serving the same model
#   (scripts/setup_cube_cloud_ci.sh) under the
#   protected cube-cloud-integration environment, with a one-hour token minted
#   per run from the deployment's API secret; the deployment's warehouse is an
#   in-memory DuckDB it builds itself, so it reaches nothing.
#   Trino: no setup for the exhaustive suite. It runs against a container pair
#   started by scripts/setup_trino_dev.sh (Trino plus the Postgres database its
#   keyless Iceberg catalog keeps table pointers in): free, keyless, and
#   fork-runnable, Iceberg included. A separate narrow trino_iceberg job reads
#   the Glue and S3 Iceberg catalog under the protected
#   trino-iceberg-integration environment, through an IAM role that trusts only
#   that environment's OIDC tokens and may write only the dbt dev database
#   (scripts/setup_trino_iceberg_ci.sh; a budget alert is the backstop).
on:
  push:
    branches: [main]
    paths:
      - "packages/dex-core/**"
      - "scripts/clickhouse*"
      - "scripts/clickhouse_cloud/**"
      - "scripts/setup_*_dev.sh"
      - "scripts/setup_clickhouse_cloud_ci.sh"
      - "scripts/postgres_seed.sql"
      - "scripts/check_container_hardening.sh"
      - "scripts/check_no_skips.py"
      - "scripts/trino*"
      - "scripts/trino/**"
      - "scripts/cube/**"
      - "scripts/cube_cloud/**"
      - "scripts/setup_cube_cloud_ci.sh"
      - "scripts/setup_trino_iceberg_ci.sh"
      - ".github/workflows/integration.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: the scratch scopes are shared, and serializing runs caps
# worst-case concurrent spend.
concurrency:
  group: cloud-integration
  cancel-in-progress: false

# Every job selects its interpreter explicitly rather than inheriting the
# runner's system Python, which moved under this workflow once already. 3.14 is
# the newest supported: the unit matrix covers 3.11 to 3.14 offline, and these
# live jobs run once, on the version most likely to differ, rather than
# multiplying cloud spend across four (#795).
jobs:
  bigquery:
    # Forks have a different repository name, so they skip here; a fork can run
    # the same suite against its own GCP project via the DEX_TEST_BQ_* env.
    if: github.repository == 'exmergo/dex'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment carries the GCP variables and, via its deployment branch
    # policy (main only), refuses this job to a workflow modified on a branch
    # before the auth step can run. Same posture as the release workflow's
    # pypi/pypi-stub environments.
    environment: gcp-integration
    permissions:
      contents: read
      id-token: write # OIDC for Workload Identity Federation; no stored keys.
    defaults:
      run:
        working-directory: packages/dex-core
    env:
      DEX_TEST_BQ_PROJECT: ${{ vars.DEX_TEST_BQ_PROJECT }}
      DEX_TEST_BQ_DATASET: dex_ci
      DEX_TEST_BQ_MAX_BYTES: "104857600" # 100 MB per query
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      # [slayer] runs the governed SLayer query smoke (test_slayer_query.py),
      # which skips itself without it.
      - name: Sync (bigquery + duckdb + slayer + dev extras)
        run: uv sync --extra bigquery --extra duckdb --extra slayer --extra dev
      # Exports Application Default Credentials (credential file plus
      # GOOGLE_APPLICATION_CREDENTIALS/GOOGLE_CLOUD_PROJECT), which is exactly
      # the discovery path the engine uses: no CI special-casing anywhere.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_INTEGRATION_SA }}
      # Every new client re-fetches a GitHub OIDC token for federation, so a
      # timeout at GitHub's token endpoint fails whichever test was mid-auth
      # (runs 40327780740, 40328565107). Rerun only that failure, once; any
      # other failure, or the same one twice, still fails the job.
      - name: Live BigQuery integration suite
        run: >-
          uv run --with pytest-rerunfailures==16.7
          pytest tests/integration -q -m bigquery
          --reruns 1 --only-rerun "Unable to retrieve Identity Pool subject token"

  snowflake:
    if: github.repository == 'exmergo/dex'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment carries the Snowflake variables and, via its deployment
    # branch policy (main only), refuses this job to a workflow modified on a
    # branch before the token is minted. The Snowflake-side pin mirrors it:
    # the DEX_CI service user accepts only tokens whose subject names this
    # repo + environment.
    environment: snowflake-integration
    permissions:
      contents: read
      id-token: write # OIDC for Snowflake workload identity; no stored keys.
    defaults:
      run:
        working-directory: packages/dex-core
    env:
      DEX_TEST_SNOWFLAKE_DATABASE: DEX_CI
      DEX_TEST_SNOWFLAKE_WAREHOUSE: DEX_CI_WH
      DEX_TEST_SNOWFLAKE_MAX_SECONDS: "60"
      # The role test_snowflake_semantic_views.py deploys its fixture views
      # with (scripts/setup_snowflake_ci.sh), apart from DEX_CI_ROLE, which
      # dex runs as. A role name, not a credential.
      DEX_TEST_SNOWFLAKE_SV_DEPLOYER_ROLE: DEX_CI_SV_DEPLOYER
      SNOWFLAKE_ACCOUNT: ${{ vars.DEX_TEST_SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ vars.DEX_TEST_SNOWFLAKE_USER }}
      SNOWFLAKE_AUTHENTICATOR: WORKLOAD_IDENTITY
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      # [slayer] runs the governed SLayer query smoke (test_slayer_query.py),
      # and [semantic-views] the Semantic View suite
      # (test_snowflake_semantic_views.py); each skips itself without its extra.
      - name: Sync (snowflake + duckdb + slayer + semantic-views + dev extras)
        run: uv sync --extra snowflake --extra duckdb --extra slayer --extra semantic-views --extra dev
      # Mint the GitHub OIDC token Snowflake validates (audience pinned to
      # what the service user's OIDC_AUDIENCE_LIST expects) and hand it to the
      # connector through the same SNOWFLAKE_* discovery path the engine uses
      # everywhere: no CI special-casing.
      - name: Mint GitHub OIDC token for Snowflake
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('snowflakecomputing.com')
            core.setSecret(token)
            core.exportVariable('SNOWFLAKE_TOKEN', token)
      # Keyless: connect, explore, and the transform tests' own skip guard all
      # run on the workload identity above. The transform tests skip themselves
      # here (dbt cannot authenticate that way) and run in the next step.
      - name: Live Snowflake integration suite
        run: uv run pytest tests/integration -q -m snowflake
      # The one step that cannot be keyless. dbt-snowflake's profile has no
      # workload-identity provider field, so `transform init` refuses to render
      # a WIF profile and these tests need a durable credential: a key pair on
      # a separate service user holding the same least-privilege role, so the
      # blast radius is unchanged (read the samples, write the transient
      # scratch database) and DEX_CI itself stays keyless. The secret is
      # readable only by this environment, whose deployments are pinned to
      # main, so a pull request cannot reach it.
      # The PEM is materialized by a step of its own so the step that runs
      # pytest never holds it: a child can read its parent's initial
      # environment from /proc, so unsetting it for the child alone would not
      # be enough. The test step gets only the file's path, and the file is
      # owner-only because dex refuses a key file other accounts can read.
      - name: Materialize the dbt key pair for the transform suite
        env:
          SNOWFLAKE_DBT_USER: ${{ vars.DEX_TEST_SNOWFLAKE_DBT_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.DEX_TEST_SNOWFLAKE_PRIVATE_KEY }}
        run: |
          # Without these the suite reads Snowflake as "not configured" and
          # skips itself green, which is the one failure mode the transform
          # step exists to prevent. Refuse instead: the credential comes from
          # the setup script, so a missing one means it has not been re-run.
          if [ -z "$SNOWFLAKE_DBT_USER" ] || [ -z "$SNOWFLAKE_PRIVATE_KEY" ]; then
            echo "::error::DEX_TEST_SNOWFLAKE_DBT_USER or DEX_TEST_SNOWFLAKE_PRIVATE_KEY is missing from the snowflake-integration environment; re-run scripts/setup_snowflake_ci.sh"
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/snowflake_ci_dbt_key.p8"
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$RUNNER_TEMP/snowflake_ci_dbt_key.p8"
      # Emptying SNOWFLAKE_TOKEN and the WIF provider is what makes discovery
      # pick the key pair rather than the token the job already minted.
      - name: Live Snowflake transform suite (dbt, key pair)
        env:
          SNOWFLAKE_USER: ${{ vars.DEX_TEST_SNOWFLAKE_DBT_USER }}
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: ""
          SNOWFLAKE_TOKEN: ""
          SNOWFLAKE_PRIVATE_KEY_FILE: ${{ runner.temp }}/snowflake_ci_dbt_key.p8
        run: uv run pytest tests/integration/test_snowflake_transform.py -q -m snowflake
      - name: Remove the dbt key pair
        if: always()
        run: rm -f "$RUNNER_TEMP/snowflake_ci_dbt_key.p8"

  databricks:
    if: github.repository == 'exmergo/dex'
    runs-on: ubuntu-latest
    # 25, not the usual 15: the suite took ten minutes on 2026-11-23 and ran
    # past fifteen later that day once the generated-test parity harness grew
    # (temporal, freshness and continuity rows), with warehouse cold starts
    # on top. Every statement stays capped by STATEMENT_TIMEOUT.
    timeout-minutes: 25
    # The environment carries the Databricks variables and, via its deployment
    # branch policy (main only), refuses this job to a workflow modified on a
    # branch before the token is minted. The Databricks-side pin mirrors it:
    # the service principal's federation policy accepts only tokens whose
    # subject names this repo + environment.
    environment: databricks-integration
    permissions:
      contents: read
      id-token: write # OIDC for the federation-policy token exchange; no stored keys.
    defaults:
      run:
        working-directory: packages/dex-core
    env:
      DATABRICKS_HOST: ${{ vars.DEX_TEST_DATABRICKS_HOST }}
      # The exchanged token expires during longer suites. Explicitly select
      # the SDK's renewable GitHub provider over its default PAT preference,
      # including when dbt constructs Config(host=..., token=...).
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_CLIENT_ID: ${{ vars.DEX_TEST_DATABRICKS_CLIENT_ID }}
      # setup_databricks_ci.sh pins the federation policy to this audience.
      DATABRICKS_TOKEN_AUDIENCE: ${{ vars.DEX_TEST_DATABRICKS_HOST }}
      DEX_TEST_DATABRICKS_WAREHOUSE: ${{ vars.DEX_TEST_DATABRICKS_WAREHOUSE }}
      DEX_TEST_DATABRICKS_CATALOG: ${{ vars.DEX_TEST_DATABRICKS_CATALOG }}
      DEX_TEST_DATABRICKS_MAX_SECONDS: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync (databricks + duckdb + dev extras)
        run: uv sync --extra databricks --extra duckdb --extra dev
      # dbt needs a token to select its SDK-backed token branch instead of an
      # interactive browser flow. Keep this bootstrap exchange; the explicit
      # github-oidc auth type above makes both clients acquire fresh tokens
      # through the SDK rather than keep sending this short-lived token.
      - name: Exchange GitHub OIDC token for a Databricks token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const githubToken = await core.getIDToken(process.env.DATABRICKS_HOST)
            const response = await fetch(`${process.env.DATABRICKS_HOST}/oidc/v1/token`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                client_id: '${{ vars.DEX_TEST_DATABRICKS_CLIENT_ID }}',
                grant_type: 'urn:ietf:params:oauth:grant-type:token-exchange',
                scope: 'all-apis',
                subject_token_type: 'urn:ietf:params:oauth:token-type:jwt',
                subject_token: githubToken,
              }),
            })
            if (!response.ok) {
              core.setFailed(`token exchange failed: ${response.status} ${await response.text()}`)
              return
            }
            const token = (await response.json()).access_token
            core.setSecret(token)
            core.exportVariable('DATABRICKS_TOKEN', token)
      # Each SDK Config re-fetches a GitHub OIDC token (github-oidc above), so
      # a timeout at GitHub's token endpoint fails whichever test was mid-auth.
      # Inside Config() the engine sees only that no credential resolved, so
      # that message is rerun too. Once, and only these (see the bigquery job).
      - name: Live Databricks integration suite
        run: >-
          uv run --with pytest-rerunfailures==16.7
          pytest tests/integration -q -m databricks
          --reruns 1
          --only-rerun "Cannot get GitHub OIDC token"
          --only-rerun "environment variables are set but no credential resolved"

  redshift:
    if: github.repository == 'exmergo/dex'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment carries the AWS variables and, via its deployment branch
    # policy (main only), refuses this job to a workflow modified on a branch
    # before the role is assumed. The AWS-side pin mirrors it: the role's
    # trust policy accepts only GitHub OIDC tokens whose subject names this
    # repo + environment.
    environment: redshift-integration
    permissions:
      contents: read
      id-token: write # OIDC for AWS role assumption; no stored keys.
    defaults:
      run:
        working-directory: packages/dex-core
    env:
      DEX_TEST_REDSHIFT_WORKGROUP: ${{ vars.DEX_TEST_REDSHIFT_WORKGROUP }}
      DEX_TEST_REDSHIFT_DATABASE: ${{ vars.DEX_TEST_REDSHIFT_DATABASE }}
      DEX_TEST_REDSHIFT_HOST: ${{ vars.DEX_TEST_REDSHIFT_HOST }}
      DEX_TEST_REDSHIFT_MAX_SECONDS: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      # [slayer] runs the governed SLayer query smoke (test_slayer_query.py),
      # which skips itself without it.
      - name: Sync (redshift + duckdb + slayer + dev extras)
        run: uv sync --extra redshift --extra duckdb --extra slayer --extra dev
      # Assume the OIDC-trusted role, exporting AWS_* credentials into the
      # default chain, which is exactly the discovery path the engine uses:
      # no CI special-casing anywhere.
      - name: Assume the Redshift integration role via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEX_TEST_REDSHIFT_ROLE_ARN }}
          aws-region: ${{ vars.DEX_TEST_REDSHIFT_REGION }}
      - name: Live Redshift integration suite
        run: >-
          uv run pytest tests/integration -q -m redshift
          --ignore=tests/integration/test_redshift_transform.py
      # The dbt_dev password is the transform suite's alone; the engine itself
      # stays keyless (IAM temporary credentials through the assumed role). So
      # it rides on this step and no other. The secret is readable only by this
      # environment, whose deployments are pinned to main, so a pull request
      # cannot reach it.
      - name: Live Redshift transform suite (dbt, dbt_dev password)
        env:
          DEX_TEST_REDSHIFT_DEV_PASSWORD: ${{ secrets.DEX_TEST_REDSHIFT_DEV_PASSWORD }}
        run: |
          # Without it the transform tests skip themselves green; refuse.
          if [ -z "$DEX_TEST_REDSHIFT_DEV_PASSWORD" ]; then
            echo "::error::DEX_TEST_REDSHIFT_DEV_PASSWORD is missing from the redshift-integration environment; re-run scripts/setup_redshift_ci.sh"
            exit 1
          fi
          uv run pytest tests/integration/test_redshift_transform.py -q -m redshift

  postgres:
    # No repository gate and no environment: the target is a job-local service
    # container, so there is nothing to authenticate against and nothing a
    # fork could spend.
    runs-on: ubuntu-latest
    # 30, double the usual 15: the Elementary step below builds six
    # variants at two package releases, about 9.5 minutes on a hosted runner,
    # and the whole job took about 13 (2026-11-22), leaving room for a third
    # release.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/dex-core
    # Same image digest as scripts/setup_postgres_dev.sh; bump both together.
    # Hardened like that container, with one difference: the entrypoint starts
    # as root here and needs SETUID and SETGID, the only capabilities added
    # back, to drop to the postgres user (it ignores its own failed chmods, and
    # the data directory the image ships is already postgres's). Once it has
    # dropped, the server holds no capabilities at all. The first step below
    # refuses the job if any of this is missing.
    services:
      postgres:
        image: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d # 16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --cap-drop ALL
          --cap-add SETUID
          --cap-add SETGID
          --security-opt no-new-privileges:true
          --pids-limit 256
          --memory 1g
    env:
      DEX_TEST_PG_DSN: postgresql://dex_ro:dex_ro@localhost:5432/dex_dogfood
      DEX_TEST_PG_DEV_PASSWORD: dbt_dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse an unhardened service container
        working-directory: .
        run: >-
          scripts/check_container_hardening.sh "${{ job.services.postgres.id }}"
          sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
          SETUID SETGID
      # The same seed the local dogfood container uses; psql ships on
      # ubuntu-latest runners.
      - name: Seed the service container
        working-directory: .
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS dex_dogfood WITH (FORCE)" \
            -c "CREATE DATABASE dex_dogfood"
          PGPASSWORD=postgres psql -h localhost -U postgres -d dex_dogfood \
            -v ON_ERROR_STOP=1 -f scripts/postgres_seed.sql
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync (postgres + duckdb + slayer + dev extras)
        run: uv sync --extra postgres --extra duckdb --extra slayer --extra dev
      - name: Live Postgres integration suite
        run: >-
          uv run pytest tests/integration -q -m postgres
          --ignore=tests/integration/test_postgres_elementary.py
      # The Elementary fixture at the package releases most installs pin
      # (LEGACY_VERSIONS in tests/transform/elementary_fixture.py, which is where
      # a release is added). Its own step, with DEX_TEST_ELEMENTARY on the step
      # rather than the job, so the suite above never runs it a second time. The
      # file skips itself without the variable, and pytest counts a skip as a
      # pass, so check_no_skips.py fails the step on any skip rather than
      # letting a dropped variable read as green.
      - name: Elementary fixture on Postgres
        env:
          DEX_TEST_ELEMENTARY: "1"
        run: |
          uv run pytest tests/integration/test_postgres_elementary.py -q -m postgres \
            --junitxml "$RUNNER_TEMP/elementary-postgres.xml"
          uv run python ../../scripts/check_no_skips.py "$RUNNER_TEMP/elementary-postgres.xml"

  elementary_duckdb:
    # The Elementary fixture's own file, on local DuckDB at the releases that
    # carry DuckDB macros. It needs no service and no account, only the dbt
    # package hub, so like postgres it has no repository gate. It is here
    # rather than in ci.yml because installing the package needs the network,
    # and pull requests stay deterministic (#1380).
    runs-on: ubuntu-latest
    # The file's 55 cases took 14:47 and 23:33 on two hosted runs on main
    # (2026-11-23). Open pull requests add cases to it, so the limit leaves
    # room for a slow runner: a run that hits it is cancelled, and main reads
    # red.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync (duckdb + dev extras)
        run: uv sync --extra duckdb --extra dev
      # As on Postgres: the file skips itself without the variable, so any skip
      # fails the step.
      - name: Elementary fixture on DuckDB
        env:
          DEX_TEST_ELEMENTARY: "1"
        run: |
          uv run pytest tests/transform/test_elementary_fixture.py -q \
            --junitxml "$RUNNER_TEMP/elementary-duckdb.xml"
          uv run python ../../scripts/check_no_skips.py "$RUNNER_TEMP/elementary-duckdb.xml"

  cube:
    # No repository gate and no environment: a governed Cube query (#913) is
    # rendered by Cube Core and executed by dex, and both the renderer and the
    # warehouse are containers this job starts. The render containers know the
    # warehouse's type and hold no credential for it, so every number they
    # answer was executed by dex. The executing containers (`--api`, #914) run
    # the same questions themselves, over the Postgres service as its read-only
    # role and an in-memory DuckDB built from scripts/cube/shop.sql. Their API
    # secret is random per run and stays in a file. ClickHouse and Trino (#1410)
    # are rendered for and executed by dex only, over seeded containers this job
    # starts with the `clickhouse` and `trino` jobs' own scripts, which is what
    # the longer timeout is for.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/dex-core
    # The postgres job's service container, digest and hardening included.
    services:
      postgres:
        image: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d # 16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --cap-drop ALL
          --cap-add SETUID
          --cap-add SETGID
          --security-opt no-new-privileges:true
          --pids-limit 256
          --memory 1g
    env:
      DEX_TEST_PG_DSN: postgresql://dex_ro:dex_ro@localhost:5432/dex_dogfood
      DEX_TEST_CH_DSN: clickhouse://dex_ro:dex_ro@127.0.0.1:8124/app
      DEX_TEST_TRINO_URL: http://dex_ro@127.0.0.1:8085
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse an unhardened service container
        working-directory: .
        run: >-
          scripts/check_container_hardening.sh "${{ job.services.postgres.id }}"
          sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
          SETUID SETGID
      - name: Seed the service container
        working-directory: .
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS dex_dogfood WITH (FORCE)" \
            -c "CREATE DATABASE dex_dogfood"
          PGPASSWORD=postgres psql -h localhost -U postgres -d dex_dogfood \
            -v ON_ERROR_STOP=1 -f scripts/postgres_seed.sql
      - name: Start render-only and executing Cube Core for DuckDB and Postgres
        working-directory: .
        run: |
          scripts/setup_cube_dev.sh --db duckdb
          scripts/setup_cube_dev.sh --db postgres
          scripts/setup_cube_dev.sh --execute --db duckdb
          scripts/setup_cube_dev.sh --execute --db postgres
      # dex names every Trino relation with its catalog, so the Trino renderer
      # serves a copy of the model with each table under the seeded `memory`
      # catalog; the test makes the same copy.
      - name: Start ClickHouse and Trino, and a render-only Cube Core for each
        working-directory: .
        run: |
          scripts/setup_clickhouse_dev.sh
          scripts/setup_trino_dev.sh
          cp -r scripts/cube/model "$RUNNER_TEMP/cube-trino-model"
          sed -i 's/sql_table: app\./sql_table: memory.app./' \
            "$RUNNER_TEMP"/cube-trino-model/cubes/*.yml
          scripts/setup_cube_dev.sh --db clickhouse
          scripts/setup_cube_dev.sh --db trino --model "$RUNNER_TEMP/cube-trino-model"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync (postgres + duckdb + clickhouse + trino + cube + semantic-api + dev extras)
        run: >-
          uv sync --extra postgres --extra duckdb --extra clickhouse --extra trino
          --extra cube --extra semantic-api --extra dev
      # The secret and the URLs come from the file the setup script wrote, read
      # in the one step whose tests use them.
      - name: Live Cube integration suite
        run: |
          source ~/.cache/dex-dogfood/cube.env
          uv run pytest tests/integration -q -m cube

  cube_cloud:
    # A Cube Cloud deployment (#914) serving scripts/cube/model over an
    # in-memory DuckDB it builds from scripts/cube/shop.sql, asked both ways:
    # Cube Cloud executes (`--api`), and Cube Cloud renders for dex to execute
    # (`--local`) on a DuckDB file built from the same statements. The protected
    # environment carries the deployment's URL and its API secret; a one-hour
    # token is minted from the secret in the one step whose tests use it.
    if: github.repository == 'exmergo/dex'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cube-cloud-integration
    defaults:
      run:
        working-directory: packages/dex-core
    env:
      DEX_TEST_CUBE_CLOUD_URL: ${{ vars.DEX_TEST_CUBE_CLOUD_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the protected Cloud configuration
        run: |
          test -n "$DEX_TEST_CUBE_CLOUD_URL" || {
            echo "::error::DEX_TEST_CUBE_CLOUD_URL is missing; run scripts/setup_cube_cloud_ci.sh"
            exit 1
          }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync (duckdb + cube + semantic-api + dev extras)
        run: uv sync --extra duckdb --extra cube --extra semantic-api --extra dev
      - name: Narrow Cube Cloud integration suite
        env:
          CUBE_CLOUD_API_SECRET: ${{ secrets.CUBE_CLOUD_API_SECRET }}
        run: |
          # Without it the suite skips itself green; refuse instead.
          if [ -z "$CUBE_CLOUD_API_SECRET" ]; then
            echo "::error::CUBE_CLOUD_API_SECRET is missing from the cube-cloud-integration environment; re-run scripts/setup_cube_cloud_ci.sh"
            exit 1
          fi
          CUBE_API_TOKEN="$(python3 ../../scripts/cube_cloud/mint_token.py)"
          echo "::add-mask::$CUBE_API_TOKEN"
          unset CUBE_CLOUD_API_SECRET
          export CUBE_API_TOKEN
          uv run pytest tests/integration/test_cube_cloud.py -q --tb=line -m cube_cloud

  clickhouse:
    # No repository gate and no environment: the target is a container this job
    # starts, so there is nothing to authenticate against and nothing a fork
    # could spend.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/dex-core
    env:
      DEX_TEST_CH_DSN: clickhouse://dex_ro:dex_ro@127.0.0.1:8124/app
      DEX_TEST_CH_DEV_PASSWORD: dbt_dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not a `services:` container. The seed is multi-statement and the HTTP
      # interface refuses multi-statement bodies, so it has to go through
      # clickhouse-client inside the container, which means the job needs a
      # container it can `docker exec` by name. Calling the dogfood script gives
      # exactly that and keeps the seeding path single-sourced.
      - name: Start and seed ClickHouse
        working-directory: .
        run: scripts/setup_clickhouse_dev.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync (clickhouse + duckdb + dev extras)
        run: uv sync --extra clickhouse --extra duckdb --extra dev
      - name: Live ClickHouse integration suite
        run: uv run pytest tests/integration -q -m clickhouse

  trino:
    # No repository gate and no environment: the targets are containers this
    # job starts, so there is nothing to authenticate against and nothing a
    # fork could spend. The Iceberg catalog is keyless too (Parquet on the
    # Trino container's file system, table pointers in a Postgres sidecar), so
    # this one job covers the lakehouse path as well.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/dex-core
    env:
      DEX_TEST_TRINO_URL: http://dex_ro@127.0.0.1:8085
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not a `services:` container, for the ClickHouse job's reason: the seed
      # goes through the trino CLI inside the container, so the job needs a
      # container it can `docker exec` by name, and the pair has to share a
      # network. Calling the dogfood script keeps the seeding path single.
      - name: Start and seed Trino
        working-directory: .
        run: scripts/setup_trino_dev.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync (trino + duckdb + dev extras)
        run: uv sync --extra trino --extra duckdb --extra dev
      - name: Live Trino integration suite
        run: uv run pytest tests/integration -q -m trino

  trino_iceberg:
    # The narrow Glue and S3 suite. The same container pair as the job above,
    # with the Glue catalog attached under a short-lived session from the OIDC
    # role scripts/setup_trino_iceberg_ci.sh provisions: no key is stored, and
    # the role can read the sources and write only the dbt dev database.
    if: github.repository == 'exmergo/dex'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Restricted to main by the environment's deployment branch policy, so a
    # branch cannot assume the role.
    environment: trino-iceberg-integration
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/dex-core
    env:
      DEX_TEST_TRINO_URL: http://dex_ro@127.0.0.1:8085
      DEX_TEST_TRINO_GLUE_SCHEMA: ${{ vars.DEX_TEST_TRINO_GLUE_SCHEMA }}
    steps:
      # Fails rather than skips: a missing variable means the environment was
      # never provisioned, and a green skip would hide that.
      - name: Require the provisioned environment
        working-directory: .
        env:
          ROLE_ARN: ${{ vars.DEX_TEST_TRINO_ROLE_ARN }}
          REGION: ${{ vars.DEX_TEST_TRINO_REGION }}
        run: |
          for name in ROLE_ARN REGION DEX_TEST_TRINO_GLUE_SCHEMA; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set; run scripts/setup_trino_iceberg_ci.sh"
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync (trino + duckdb + dev extras)
        run: uv sync --extra trino --extra duckdb --extra dev
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEX_TEST_TRINO_ROLE_ARN }}
          aws-region: ${{ vars.DEX_TEST_TRINO_REGION }}
      - name: Start and seed Trino with the Glue catalog
        working-directory: .
        run: scripts/setup_trino_dev.sh --aws
      - name: Live Trino Glue Iceberg suite
        run: uv run pytest tests/integration -q -m trino_iceberg

  clickhouse_cloud:
    if: github.repository == 'exmergo/dex'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: clickhouse-cloud-integration
    defaults:
      run:
        working-directory: packages/dex-core
    env:
      DEX_TEST_CH_CLOUD_ORG_ID: ${{ vars.DEX_TEST_CH_CLOUD_ORG_ID }}
      DEX_TEST_CH_CLOUD_SERVICE_ID: ${{ vars.DEX_TEST_CH_CLOUD_SERVICE_ID }}
      DEX_TEST_CH_CLOUD_HOST: ${{ vars.DEX_TEST_CH_CLOUD_HOST }}
      DEX_TEST_CH_CLOUD_PORT: ${{ vars.DEX_TEST_CH_CLOUD_PORT }}
      DEX_TEST_CH_CLOUD_DATABASE: ${{ vars.DEX_TEST_CH_CLOUD_DATABASE }}
      DEX_TEST_CH_CLOUD_DEV_DATABASE: ${{ vars.DEX_TEST_CH_CLOUD_DEV_DATABASE }}
      DEX_TEST_CH_CLOUD_COMPUTE_UNIT_PRICE_USD: ${{ vars.DEX_TEST_CH_CLOUD_COMPUTE_UNIT_PRICE_USD }}
      DEX_TEST_CH_CLOUD_MAX_SECONDS: ${{ vars.DEX_TEST_CH_CLOUD_MAX_SECONDS }}
      DEX_TEST_CH_CLOUD_MAX_DAILY_CHC: ${{ vars.DEX_TEST_CH_CLOUD_MAX_DAILY_CHC }}
      # Where the scoped API key's two files live (scripts/clickhouse_cloud/
      # secrets.sh reads them). tmpfs, so the bytes never reach the runner's
      # disk. A path, not a secret: the values themselves are in no job env.
      DEX_SECRETS_DIR: /dev/shm/dex-secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the protected Cloud configuration
        run: |
          for name in \
            DEX_TEST_CH_CLOUD_ORG_ID DEX_TEST_CH_CLOUD_SERVICE_ID \
            DEX_TEST_CH_CLOUD_HOST DEX_TEST_CH_CLOUD_PORT \
            DEX_TEST_CH_CLOUD_DATABASE DEX_TEST_CH_CLOUD_DEV_DATABASE \
            DEX_TEST_CH_CLOUD_COMPUTE_UNIT_PRICE_USD \
            DEX_TEST_CH_CLOUD_MAX_SECONDS DEX_TEST_CH_CLOUD_MAX_DAILY_CHC; do
            test -n "${!name}" || { echo "$name is missing" >&2; exit 1; }
          done
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync (clickhouse + duckdb + dev extras)
        run: uv sync --extra clickhouse --extra duckdb --extra dev
      # The only step whose environment holds the Cloud API key. It writes the
      # key and secret to owner-only files; from here on, preflight.sh hands
      # them to its two clickhousectl calls and the Cloud test to its one, and
      # nothing else in the job (uv, pytest, dbt, the engine) ever has them.
      - name: Materialize the Cloud API key for the commands that read it
        env:
          API_KEY: ${{ secrets.DEX_TEST_CH_CLOUD_API_KEY }}
          API_SECRET: ${{ secrets.DEX_TEST_CH_CLOUD_API_SECRET }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$API_SECRET" ]; then
            echo "::error::DEX_TEST_CH_CLOUD_API_KEY or DEX_TEST_CH_CLOUD_API_SECRET is missing from the clickhouse-cloud-integration environment; re-run scripts/setup_clickhouse_cloud_ci.sh"
            exit 1
          fi
          install -d -m 700 "$DEX_SECRETS_DIR"
          (
            umask 077
            printf '%s' "$API_KEY" > "$DEX_SECRETS_DIR/clickhouse_api_key"
            printf '%s' "$API_SECRET" > "$DEX_SECRETS_DIR/clickhouse_api_secret"
          )
          chmod 400 "$DEX_SECRETS_DIR/clickhouse_api_key" "$DEX_SECRETS_DIR/clickhouse_api_secret"
      - name: Install clickhousectl
        working-directory: .
        env:
          CLICKHOUSECTL_VERSION: v0.4.2
          # sha256 of the bare linux-musl x86_64 binary, read from the GitHub
          # release's own asset digest:
          #   gh release view ${CLICKHOUSECTL_VERSION} -R ClickHouse/clickhousectl \
          #     --json assets --jq '.assets[] | select(.name ==
          #     "clickhousectl-x86_64-unknown-linux-musl") | .digest'
          # Re-read it from the release when bumping the version; do not take
          # it from anywhere else.
          CLICKHOUSECTL_SHA256: 70f4cd93fd159198ba8bd093c2aa32743479513b1789d80cdff8e844c8861c5b
        run: |
          asset="clickhousectl-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/ClickHouse/clickhousectl/releases/download/${CLICKHOUSECTL_VERSION}/$asset"
          echo "${CLICKHOUSECTL_SHA256}  $RUNNER_TEMP/$asset" | sha256sum -c -
          install -D -m 0755 "$RUNNER_TEMP/$asset" "$HOME/.local/bin/clickhousectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Usage preflight before any SQL connection
        id: preflight
        working-directory: .
        run: scripts/clickhouse_cloud/preflight.sh
      # The two database credentials are the suite's alone, so they ride on this
      # step and no other.
      - name: Narrow ClickHouse Cloud integration suite
        env:
          DEX_TEST_CH_CLOUD_DSN: ${{ secrets.DEX_TEST_CH_CLOUD_DSN }}
          DEX_TEST_CH_CLOUD_DEV_PASSWORD: ${{ secrets.DEX_TEST_CH_CLOUD_DEV_PASSWORD }}
        run: |
          # Without them the suite skips itself green; refuse instead.
          if [ -z "$DEX_TEST_CH_CLOUD_DSN" ] || [ -z "$DEX_TEST_CH_CLOUD_DEV_PASSWORD" ]; then
            echo "::error::DEX_TEST_CH_CLOUD_DSN or DEX_TEST_CH_CLOUD_DEV_PASSWORD is missing from the clickhouse-cloud-integration environment; re-run scripts/setup_clickhouse_cloud_ci.sh"
            exit 1
          fi
          uv run pytest tests/integration/test_clickhouse_cloud.py -q --tb=line -m clickhouse_cloud
      - name: Provisional post-run usage report
        if: always() && steps.preflight.outcome != 'skipped'
        working-directory: .
        run: scripts/clickhouse_cloud/preflight.sh --report-only
      - name: Remove the Cloud API key files
        if: always()
        run: rm -rf "$DEX_SECRETS_DIR"
