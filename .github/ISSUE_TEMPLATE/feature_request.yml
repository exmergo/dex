name: Feature request
description: Suggest a capability or improvement. Requests drafted by an agent on a person's behalf are welcome.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for the idea. A refusal that stopped a legitimate change, or a
        workaround you keep repeating, is a good reason to file one.
        `dex feedback` prints a link that prefills this form.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does dex fall short today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like dex to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including any workaround you use today.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Explore
        - Transform
        - Maintain
        - Semantic layer
        - Connectors
        - Setup and install (dex init, skills, plugins)
        - DexEngine / command contract
        - Evals / benchmarks
        - Other
    validations:
      required: true
  - type: dropdown
    id: filed-by
    attributes:
      label: Filed by
      options:
        - A person
        - An agent, on a person's behalf
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dex-core version
      description: Optional. The `exmergo-dex-core` version (`dex feedback` prints it).
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Optional. Paste `data.environment` from `dex feedback`.
      render: text
