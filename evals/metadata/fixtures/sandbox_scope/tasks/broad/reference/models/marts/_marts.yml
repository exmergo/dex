version: 2
models:
  - name: dim_accounts
    description: The account directory, one row per account.
    config:
      meta:
        dex:
          grain: [account_id]
          population:
            rule: "Customer accounts only; sandbox tenants are excluded."
            filters:
              - column: is_sandbox
                excludes: [true]
          assumptions:
            - decision: Whether sandbox accounts stay in the directory
              chosen: sandbox accounts excluded
              evidence: request
              column: is_sandbox
              detail: the request names the account directory
    columns:
      - name: account_id
        data_tests: [unique, not_null]
        config: {meta: {dex: {role: key}}}
      - name: account_name
        config: {meta: {dex: {role: attribute}}}
      - name: region
        config: {meta: {dex: {role: dimension}}}
      - name: is_sandbox
        config: {meta: {dex: {role: dimension}}}
  - name: account_usage_daily
    description: Usage per account per day.
    config:
      meta:
        dex:
          grain: [account_id, used_on]
          population:
            rule: "Usage of customer accounts; sandbox tenants' usage is excluded."
          assumptions:
            - decision: Whether sandbox usage counts
              chosen: sandbox usage excluded
              evidence: request
              column: is_sandbox
              detail: the request names daily usage
    columns:
      - name: account_id
        config: {meta: {dex: {role: foreign_key, references: dim_accounts.account_id}}}
      - name: used_on
        config: {meta: {dex: {role: time}}}
      - name: units
        config: {meta: {dex: {role: measure, aggregation: sum, additivity: additive, unit: count}}}
      - name: usage_records
        config: {meta: {dex: {role: measure, aggregation: sum, additivity: additive, unit: count}}}
  - name: region_account_summary
    description: Customer accounts and their usage per region; every region is listed.
    config:
      meta:
        dex:
          grain: [region]
          population:
            rule: "Every region; sandbox tenants are left out of both counts."
          assumptions:
            - decision: Whether sandbox accounts count in the regional totals
              chosen: sandbox accounts excluded
              evidence: request
              column: is_sandbox
              detail: the request names the region summary
    columns:
      - name: region
        data_tests: [unique, not_null]
        config: {meta: {dex: {role: key}}}
      - name: accounts
        config: {meta: {dex: {role: measure, aggregation: sum, additivity: additive, unit: count}}}
      - name: units
        config: {meta: {dex: {role: measure, aggregation: sum, additivity: additive, unit: count}}}
