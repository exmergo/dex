version: 2
models:
  - name: dim_accounts
    description: The account directory, one row per account.
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: account_name
      - name: region
      - name: is_sandbox
  - name: account_usage_daily
    description: Usage per account per day.
    columns:
      - name: account_id
      - name: used_on
      - name: units
      - name: usage_records
  - name: region_account_summary
    description: Accounts and usage per region.
    columns:
      - name: region
        data_tests: [unique, not_null]
      - name: accounts
      - name: units
