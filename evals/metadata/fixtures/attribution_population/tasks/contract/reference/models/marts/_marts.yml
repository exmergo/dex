version: 2
models:
  - name: account_event_rate
    description: One row per account that had at least one event in the window. Accounts with no events are out of scope for this mart.
    config:
      meta:
        dex:
          grain: [account_id]
          population:
            rule: Accounts with at least one event in the window; accounts with no events are excluded.
          assumptions:
            - decision: Whether accounts with no events belong in the output
              chosen: only accounts with events
              evidence: contract
              detail: models/marts/_marts.yml declares this population
    columns:
      - name: account_id
        data_tests: [unique, not_null]
        config: {meta: {dex: {role: key}}}
      - name: event_count
        config: {meta: {dex: {role: measure, aggregation: sum, additivity: additive, unit: count}}}
      - name: events_per_day
        config: {meta: {dex: {role: measure, aggregation: avg, additivity: non_additive, unit: events per day}}}
