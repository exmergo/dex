# Ruff lints and formats every Python tree in the monorepo (the engine under
# packages/, the PEP 723 skill wrappers under skills/, and the helper scripts).
# It is run from the repo root so a single config governs all of them; Ruff's
# upward config discovery means editor and pre-commit invocations find it too.

target-version = "py311"
line-length = 88

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "N",    # pep8-naming
  "S",    # flake8-bandit (security)
  "PTH",  # flake8-use-pathlib
  "PERF", # perflint
  "RUF",  # Ruff-specific rules
]
# UP042 (replace-str-enum) would rewrite the `(str, Enum)` wire-format enums to
# StrEnum, which changes their `str()` output and risks the serialized envelope.
# That is a deliberate engine decision, not a side effect of adopting a linter.
ignore = ["UP042"]

[lint.per-file-ignores]
# Tests: assert is the pytest idiom (S101), and the safety-spine tests
# deliberately assert that *any* exception is raised on a refused write (B017).
"packages/dex-core/tests/**" = ["S101", "B017"]
# The storage conformance contract is a test suite that happens to ship inside
# the package (so a backend outside this distribution can run it), so it is
# written in the pytest idiom like any other test file (S101).
"packages/dex-core/src/exmergo_dex_core/storage/conformance.py" = ["S101"]
# The project conformance contract ships for the same reason and in the same
# idiom (S101).
"packages/dex-core/src/exmergo_dex_core/adapters/conformance.py" = ["S101"]
# The semantic edit-target conformance contract also ships for reuse and uses
# pytest assertions for the same reason (S101).
"packages/dex-core/src/exmergo_dex_core/edits_conformance.py" = ["S101"]
# The semantic-backend conformance contract, third of the three, same reason and
# same idiom (S101).
"packages/dex-core/src/exmergo_dex_core/explore/semantic/conformance.py" = ["S101"]
# The skill wrappers shell out to the pinned dex CLI by design; the command is
# a fixed path plus an argv passthrough, not untrusted input (S603). The engine
# is reached by exec rather than a spawn, so the wrapper does not sit waiting on
# a child it has nothing left to say to, which is the same fixed command by
# another syscall (S606).
"skills/**/scripts/run.py" = ["S603", "S606"]
# The Tier-2 eval backend drives the resolved `claude` CLI by design (S603); the
# eval core tests use pytest's assert idiom (S101).
"evals/claude_agent.py" = ["S603"]
"evals/tests/**" = ["S101"]

[lint.isort]
known-first-party = ["exmergo_dex_core"]
